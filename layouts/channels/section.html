{{ define "main" }}
<div id="channels">
  <h1>{{ .Title }}</h1>
  <div id="search"></div>

  {{ range (.Pages.ByDate.ByParam "videos").Reverse }}
    {{ partial "channels/channel.html" (dict "channel" . "type" "teaser") }}
  {{ end }}

  <p id="empty">No results</p>
  <div id="pager"></div>
</div>
{{ end }}
