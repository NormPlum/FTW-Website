{{ define "main" }}
<section id="channels">
  <h1>{{ .Title }}</h1>
  <div id="filters">
    <div id="search"></div>
  </div>

  <div class="articles">
    {{ range (.Pages.ByDate.ByParam "videos").Reverse }}
      {{ partial "channels/channel.html" (dict "channel" . "type" "teaser") }}
    {{ end }}
    <p id="empty">No results</p>
  </div>

  <div id="pager"></div>
</section>
{{ end }}
