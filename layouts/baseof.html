<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "page/head.html" . }}
</head>
<body>
  <div id="sidebar">
    <header>
      {{ partial "page/header.html" . }}
    </header>
    <nav>
      {{ partial "page/menu.html" (dict "menuID" "main" "page" .) }}
    </nav>
    <footer>
      {{ partial "page/footer.html" . }}
    </footer>
  </div>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
