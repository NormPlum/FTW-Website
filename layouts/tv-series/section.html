{{ define "main" }}
<section id="tv-series">
  <h1>TV Series</h1>
  <div id="filters">
    <div id="search"></div>
  </div>

  <div class="articles">
    {{ range (.Pages.ByDate.ByParam "channels").Reverse }}
      {{ partial "tmdb/tv-series.html" (dict "tvSeries" . "type" "teaser") }}
    {{ end }}
    <p id="empty">No results</p>
  </div>

  <div id="pager"></div>
</section>
{{ end }}
