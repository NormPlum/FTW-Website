{{ define "main" }}
<section id="movies">
  <h1>{{ .Title }}</h1>
  <div id="filters">
    <div id="search"></div>
  </div>

  <div class="articles">
    {{ range (.Pages.ByDate.ByParam "channels").Reverse }}
      {{ partial "tmdb/movie.html" (dict "movie" . "type" "teaser") }}
    {{ end }}
    <p id="empty">No results</p>
  </div>

  <div id="pager"></div>
</section>
{{ end }}
