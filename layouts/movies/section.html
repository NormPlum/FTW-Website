{{ define "main" }}
<div id="movies">
  <h1>{{ .Title }}</h1>
  <div id="search"></div>
  <div id="filters"></div>

  {{ range (.Pages.ByDate.ByParam "channels").Reverse }}
    {{ partial "tmdb/movie.html" (dict "movie" . "type" "teaser") }}
  {{ end }}

  <p id="empty">No results</p>
  <div id="pager"></div>
</div>
{{ end }}
